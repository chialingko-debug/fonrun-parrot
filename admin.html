<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>鳳潤鳥宿・後台管理</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Cormorant+Garamond:wght@300;400;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#1a1410;--surface:#241e18;--surface2:#2e2620;--border:#3a3028;
  --gold:#e07050;--gold-lt:#f09070;--text:#e8d8c0;--text-dim:#a08868;
  --green:#5a9a6a;--red:#c05040;--yellow:#c8a040;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;}

/* LOGIN */
#loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:radial-gradient(ellipse at 50% 40%,rgba(224,112,80,0.08),transparent 70%),var(--bg);}
.login-box{width:360px;padding:2.5rem;background:var(--surface);border:1px solid var(--border);border-radius:20px;}
.login-logo{font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:300;color:var(--gold);text-align:center;margin-bottom:0.3rem;letter-spacing:0.1em;}
.login-sub{font-size:0.8rem;color:var(--text-dim);text-align:center;margin-bottom:2rem;letter-spacing:0.2em;}
.login-box label{display:block;font-size:0.8rem;color:var(--text-dim);margin-bottom:6px;letter-spacing:0.12em;}
.login-box input{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:0.95rem;outline:none;margin-bottom:1rem;transition:border-color 0.2s;font-family:'Noto Sans TC',sans-serif;}
.login-box input:focus{border-color:rgba(224,112,80,0.5);}
.login-btn{width:100%;padding:11px;background:var(--gold);color:#1a1410;border:none;border-radius:10px;font-size:0.95rem;font-weight:700;cursor:pointer;transition:background 0.2s;font-family:'Noto Sans TC',sans-serif;letter-spacing:0.1em;}
.login-btn:hover{background:var(--gold-lt);}
.login-err{color:var(--red);font-size:0.85rem;text-align:center;margin-top:0.8rem;min-height:1.2em;}

/* ADMIN */
#adminScreen{display:none;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem;height:56px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;}
.topbar-logo{font-family:'Cormorant Garamond',serif;font-size:1.2rem;color:var(--gold);letter-spacing:0.1em;}
.topbar-right{display:flex;align-items:center;gap:1rem;}
.logout-btn{padding:6px 14px;background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--text-dim);font-size:0.82rem;cursor:pointer;transition:border-color 0.2s,color 0.2s;font-family:'Noto Sans TC',sans-serif;}
.logout-btn:hover{border-color:var(--gold);color:var(--gold);}
.tabs{display:flex;gap:4px;padding:1rem 1.5rem 0;border-bottom:1px solid var(--border);}
.tab{padding:8px 20px;border-radius:10px 10px 0 0;cursor:pointer;font-size:0.88rem;color:var(--text-dim);border:1px solid transparent;border-bottom:none;transition:color 0.2s,background 0.2s;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--gold);background:var(--surface);border-color:var(--border);}
.content{padding:1.5rem;}

/* STATS */
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:1.5rem;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1rem 1.2rem;}
.stat-label{font-size:0.75rem;color:var(--text-dim);letter-spacing:0.1em;margin-bottom:6px;}
.stat-value{font-family:'Cormorant Garamond',serif;font-size:1.8rem;font-weight:300;color:var(--gold-lt);}
.stat-sub{font-size:0.78rem;color:var(--text-dim);margin-top:2px;}

/* FILTER */
.filter-bar{display:flex;gap:0.8rem;align-items:center;margin-bottom:1rem;flex-wrap:wrap;}
.filter-bar input,.filter-bar select{padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:0.85rem;outline:none;font-family:'Noto Sans TC',sans-serif;}
.filter-bar input:focus,.filter-bar select:focus{border-color:rgba(224,112,80,0.4);}
.filter-bar input{width:180px;}

/* TABLE */
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:0.85rem;}
thead tr{border-bottom:2px solid var(--border);}
th{padding:10px 12px;text-align:left;font-size:0.75rem;color:var(--text-dim);font-weight:400;letter-spacing:0.1em;white-space:nowrap;}
td{padding:10px 12px;border-bottom:1px solid rgba(58,48,40,0.5);vertical-align:top;}
tr:hover td{background:rgba(224,112,80,0.03);}
.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:0.75rem;font-weight:500;}
.badge-pending{background:rgba(200,160,64,0.15);color:var(--yellow);}
.badge-confirmed{background:rgba(90,154,106,0.15);color:var(--green);}
.badge-done{background:rgba(90,90,100,0.2);color:var(--text-dim);}
.badge-cancel{background:rgba(192,80,64,0.15);color:var(--red);}
.badge-editor{background:rgba(224,112,80,0.15);color:var(--gold-lt);}
.badge-viewer{background:rgba(90,90,100,0.2);color:var(--text-dim);}
.action-btn{padding:4px 10px;border-radius:6px;font-size:0.78rem;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text-dim);transition:all 0.15s;font-family:'Noto Sans TC',sans-serif;margin-right:4px;}
.action-btn:hover{border-color:var(--gold);color:var(--gold);}
.action-btn.danger:hover{border-color:var(--red);color:var(--red);}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(10,8,6,0.8);z-index:200;align-items:center;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:1.8rem;width:480px;max-width:95vw;max-height:90vh;overflow-y:auto;}
.modal-title{font-size:1rem;font-weight:500;color:var(--text);margin-bottom:1.2rem;}
.modal label{display:block;font-size:0.78rem;color:var(--text-dim);margin-bottom:5px;margin-top:0.8rem;}
.modal input,.modal select,.modal textarea{width:100%;padding:9px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:0.9rem;outline:none;font-family:'Noto Sans TC',sans-serif;}
.modal textarea{resize:vertical;min-height:80px;}
.modal input:focus,.modal select:focus,.modal textarea:focus{border-color:rgba(224,112,80,0.4);}
.modal-btns{display:flex;gap:0.8rem;margin-top:1.5rem;justify-content:flex-end;}
.btn-save{padding:8px 22px;background:var(--gold);color:#1a1410;border:none;border-radius:8px;font-size:0.88rem;font-weight:700;cursor:pointer;font-family:'Noto Sans TC',sans-serif;}
.btn-save:hover{background:var(--gold-lt);}
.btn-cancel{padding:8px 16px;background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--text-dim);font-size:0.88rem;cursor:pointer;font-family:'Noto Sans TC',sans-serif;}
.btn-cancel:hover{border-color:var(--gold);color:var(--gold);}

/* REPORT */
.report-header{display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;}
.report-header select{padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:0.88rem;outline:none;font-family:'Noto Sans TC',sans-serif;}
.report-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:1.5rem;}
.report-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.2rem;text-align:center;}
.report-card .rc-label{font-size:0.78rem;color:var(--text-dim);margin-bottom:8px;}
.report-card .rc-value{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:300;color:var(--gold-lt);}
.report-table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
.report-table-title{padding:1rem 1.2rem;border-bottom:1px solid var(--border);font-size:0.88rem;color:var(--text-dim);}

/* ACCOUNTS */
.add-btn{padding:8px 18px;background:var(--gold);color:#1a1410;border:none;border-radius:8px;font-size:0.85rem;font-weight:700;cursor:pointer;font-family:'Noto Sans TC',sans-serif;margin-bottom:1rem;}
.add-btn:hover{background:var(--gold-lt);}

.loading{text-align:center;padding:2rem;color:var(--text-dim);font-size:0.9rem;}
.empty{text-align:center;padding:3rem;color:var(--text-dim);font-size:0.9rem;}
@media(max-width:768px){.stats-bar{grid-template-columns:repeat(2,1fr);}.report-grid{grid-template-columns:repeat(2,1fr);}.filter-bar input{width:140px;}}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">鳳潤鳥宿</div>
    <div class="login-sub">後台管理系統</div>
    <label>帳號</label>
    <input type="text" id="loginUser" placeholder="請輸入帳號" autocomplete="username"/>
    <label>密碼</label>
    <input type="password" id="loginPass" placeholder="請輸入密碼" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"/>
    <button class="login-btn" onclick="doLogin()">登入</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<div id="adminScreen">
  <div class="topbar">
    <div class="topbar-logo">鳳潤鳥宿・後台</div>
    <div class="topbar-right">
      <span style="font-size:0.82rem;color:var(--text-dim);" id="topUserInfo"></span>
      <button class="logout-btn" onclick="doLogout()">登出</button>
    </div>
  </div>

  <div class="tabs" id="tabBar">
    <div class="tab active" onclick="switchTab('list')">📋 預約列表</div>
    <div class="tab" onclick="switchTab('report')">📊 月報表</div>
  </div>

  <!-- 預約列表 -->
  <div id="tabList" class="content">
    <div class="stats-bar">
      <div class="stat-card"><div class="stat-label">本月預約</div><div class="stat-value" id="s1">—</div><div class="stat-sub">筆</div></div>
      <div class="stat-card"><div class="stat-label">待確認</div><div class="stat-value" id="s2">—</div><div class="stat-sub">筆</div></div>
      <div class="stat-card"><div class="stat-label">本月估算收入</div><div class="stat-value" id="s3">—</div><div class="stat-sub">NT$</div></div>
      <div class="stat-card"><div class="stat-label">本月實收</div><div class="stat-value" id="s4">—</div><div class="stat-sub">NT$</div></div>
    </div>
    <div class="filter-bar">
      <input type="text" id="filterName" placeholder="搜尋姓名 / 電話" oninput="renderList()"/>
      <select id="filterStatus" onchange="renderList()">
        <option value="">全部狀態</option>
        <option value="確認中">確認中</option>
        <option value="已確認">已確認</option>
        <option value="已完成">已完成</option>
        <option value="已取消">已取消</option>
      </select>
      <input type="month" id="filterMonth" onchange="renderList()"/>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>#</th><th>飼主</th><th>電話</th><th>鳥寶</th><th>入住</th><th>接回</th><th>估算費用</th><th>實收</th><th>狀態</th><th>操作</th></tr></thead>
        <tbody id="bookingTbody"><tr><td colspan="10" class="loading">載入中…</td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- 月報表 -->
  <div id="tabReport" class="content" style="display:none;">
    <div class="report-header">
      <span style="font-size:0.9rem;color:var(--text-dim);">選擇月份</span>
      <select id="reportMonth" onchange="renderReport()"></select>
    </div>
    <div class="report-grid">
      <div class="report-card"><div class="rc-label">總預約筆數</div><div class="rc-value" id="r1">—</div></div>
      <div class="report-card"><div class="rc-label">估算總收入</div><div class="rc-value" id="r2">—</div><div style="font-size:0.75rem;color:var(--text-dim);">NT$</div></div>
      <div class="report-card"><div class="rc-label">實收金額</div><div class="rc-value" id="r3">—</div><div style="font-size:0.75rem;color:var(--text-dim);">NT$</div></div>
      <div class="report-card"><div class="rc-label">支出金額</div><div class="rc-value" id="r4">—</div><div style="font-size:0.75rem;color:var(--text-dim);">NT$</div></div>
      <div class="report-card"><div class="rc-label">淨收入</div><div class="rc-value" id="r5">—</div><div style="font-size:0.75rem;color:var(--text-dim);">NT$</div></div>
      <div class="report-card"><div class="rc-label">平均每筆費用</div><div class="rc-value" id="r6">—</div><div style="font-size:0.75rem;color:var(--text-dim);">NT$</div></div>
    </div>
    <div class="report-table-wrap">
      <div class="report-table-title">本月預約明細</div>
      <table>
        <thead><tr><th>#</th><th>飼主</th><th>入住</th><th>接回</th><th>鳥寶</th><th>估算費用</th><th>實收</th><th>支出</th><th>狀態</th></tr></thead>
        <tbody id="reportTbody"></tbody>
      </table>
    </div>
  </div>

  <!-- 帳號管理（只有editor看得到）-->
  <div id="tabAccounts" class="content" style="display:none;">
    <button class="add-btn" onclick="openAddAccount()">＋ 新增帳號</button>
    <div class="table-wrap">
      <table>
        <thead><tr><th>#</th><th>帳號</th><th>顯示名稱</th><th>權限</th><th>建立時間</th><th>操作</th></tr></thead>
        <tbody id="accountTbody"><tr><td colspan="6" class="loading">載入中…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<!-- 編輯預約 Modal -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <div class="modal-title">編輯預約</div>
    <input type="hidden" id="editId"/>
    <label>狀態</label>
    <select id="editStatus">
      <option value="確認中">確認中</option>
      <option value="已確認">已確認</option>
      <option value="已完成">已完成</option>
      <option value="已取消">已取消</option>
    </select>
    <label>實收金額 (NT$)</label>
    <input type="number" id="editIncome" placeholder="0"/>
    <label>支出金額 (NT$)</label>
    <input type="number" id="editExpense" placeholder="0"/>
    <label>支出說明</label>
    <input type="text" id="editExpenseNote" placeholder="例：獸醫費、耗材…"/>
    <label>管理員備註</label>
    <textarea id="editAdminNote" placeholder="內部備註，客戶不會看到"></textarea>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal('editModal')">取消</button>
      <button class="btn-save" onclick="saveEdit()">儲存</button>
    </div>
  </div>
</div>

<!-- 新增/編輯帳號 Modal -->
<div class="modal-overlay" id="accountModal">
  <div class="modal">
    <div class="modal-title" id="accountModalTitle">新增帳號</div>
    <input type="hidden" id="accountEditId"/>
    <label>帳號</label>
    <input type="text" id="accountUsername" placeholder="請輸入帳號名稱"/>
    <label>顯示名稱</label>
    <input type="text" id="accountDisplayName" placeholder="例：小美、志明"/>
    <label>密碼 <span id="passHint" style="color:var(--text-dim);font-size:0.75rem;">（留空則不修改）</span></label>
    <input type="password" id="accountPassword" placeholder="請輸入密碼"/>
    <label>權限</label>
    <select id="accountRole">
      <option value="editor">editor（可編輯）</option>
      <option value="viewer">viewer（僅檢視）</option>
    </select>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal('accountModal')">取消</button>
      <button class="btn-save" onclick="saveAccount()">儲存</button>
    </div>
  </div>
</div>

<script>
var SUPABASE_URL='https://hxbaanirskvcljflfusx.supabase.co';
var SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh4YmFhbmlyc2t2Y2xqZmxmdXN4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5OTk4NDMsImV4cCI6MjEwODU3NTg0M30.rn4uuKECikgLf0KVzrXG-I8G9HZC_vkhC36Eb7H898Y';

var currentUser=null;
var allBookings=[];

// ── 密碼雜湊（用 SHA-256）──
async function hashPassword(pass){
  var enc=new TextEncoder().encode(pass);
  var buf=await crypto.subtle.digest('SHA-256',enc);
  return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
}

// ── 登入 ──
async function doLogin(){
  var username=document.getElementById('loginUser').value.trim();
  var password=document.getElementById('loginPass').value;
  var errEl=document.getElementById('loginErr');
  errEl.textContent='驗證中…';

  if(!username||!password){errEl.textContent='請輸入帳號和密碼';return;}

  var hash=await hashPassword(password);

  var res=await fetch(SUPABASE_URL+'/rest/v1/admin_users?username=eq.'+encodeURIComponent(username)+'&password_hash=eq.'+hash+'&select=id,username,display_name,role',{
    headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}
  });
  var data=await res.json();

  if(!data||data.length===0){
    errEl.textContent='帳號或密碼錯誤';return;
  }

  currentUser=data[0];
  errEl.textContent='';
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('adminScreen').style.display='block';
  initAdmin();
}

function doLogout(){
  currentUser=null;allBookings=[];
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('adminScreen').style.display='none';
  document.getElementById('loginUser').value='';
  document.getElementById('loginPass').value='';
}

// ── 初始化 ──
function initAdmin(){
  var now=new Date();
  var ym=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  document.getElementById('filterMonth').value=ym;
  document.getElementById('topUserInfo').textContent=(currentUser.display_name||currentUser.username)+' · '+(currentUser.role==='editor'?'編輯者':'檢視者');

  // editor 才顯示帳號管理 tab
  if(currentUser.role==='editor'){
    var tabBar=document.getElementById('tabBar');
    var accTab=document.createElement('div');
    accTab.className='tab';
    accTab.setAttribute('onclick',"switchTab('accounts')");
    accTab.textContent='👤 帳號管理';
    tabBar.appendChild(accTab);
  }

  buildReportMonthSelect();
  loadBookings();
}

// ── Tab 切換 ──
function switchTab(tab){
  var tabs=['list','report','accounts'];
  tabs.forEach(function(t){
    var el=document.getElementById('tab'+t.charAt(0).toUpperCase()+t.slice(1));
    if(el)el.style.display=t===tab?'block':'none';
  });
  document.querySelectorAll('.tab').forEach(function(t,i){
    t.classList.toggle('active',['list','report','accounts'][i]===tab);
  });
  if(tab==='report')renderReport();
  if(tab==='accounts')loadAccounts();
}

// ── 載入預約 ──
function loadBookings(){
  fetch(SUPABASE_URL+'/rest/v1/bookings?order=created_at.desc&limit=500',{
    headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}
  }).then(function(r){return r.json();}).then(function(data){
    allBookings=data||[];
    updateStats();renderList();
  }).catch(function(){
    document.getElementById('bookingTbody').innerHTML='<tr><td colspan="10" class="empty">載入失敗</td></tr>';
  });
}

function updateStats(){
  var now=new Date();
  var thisMonth=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  var m=allBookings.filter(function(b){return b.created_at&&b.created_at.startsWith(thisMonth);});
  document.getElementById('s1').textContent=m.length;
  document.getElementById('s2').textContent=m.filter(function(b){return !b.status||b.status==='確認中';}).length;
  document.getElementById('s3').textContent=m.reduce(function(s,b){return s+(b.total_fee||0);},0).toLocaleString();
  document.getElementById('s4').textContent=m.reduce(function(s,b){return s+(b.income||0);},0).toLocaleString();
}

function renderList(){
  var nameF=document.getElementById('filterName').value.trim().toLowerCase();
  var statusF=document.getElementById('filterStatus').value;
  var monthF=document.getElementById('filterMonth').value;
  var isEditor=currentUser&&currentUser.role==='editor';

  var filtered=allBookings.filter(function(b){
    var mn=!nameF||[(b.line_name||''),(b.fb_name||''),(b.phone||'')].some(function(s){return s.toLowerCase().includes(nameF);});
    var ms=!statusF||(b.status||'確認中')===statusF;
    var mm=!monthF||(b.checkin_date&&b.checkin_date.startsWith(monthF));
    return mn&&ms&&mm;
  });

  if(!filtered.length){document.getElementById('bookingTbody').innerHTML='<tr><td colspan="10" class="empty">沒有符合的預約</td></tr>';return;}

  var html='';
  filtered.forEach(function(b,idx){
    var status=b.status||'確認中';
    var bc=status==='已確認'?'badge-confirmed':status==='已完成'?'badge-done':status==='已取消'?'badge-cancel':'badge-pending';
    var birds=Array.isArray(b.birds)?b.birds.map(function(bi){return bi.name+'×'+bi.count;}).join('、'):'—';
    html+='<tr>'+
      '<td style="color:var(--text-dim);">'+(idx+1)+'</td>'+
      '<td><div>'+(b.line_name||'—')+'</div>'+(b.fb_name?'<div style="font-size:0.78rem;color:var(--text-dim);">FB:'+b.fb_name+'</div>':'')+'</td>'+
      '<td>'+(b.phone||'—')+'</td>'+
      '<td style="max-width:120px;">'+birds+'</td>'+
      '<td style="white-space:nowrap;">'+(b.checkin_date||'—')+'</td>'+
      '<td style="white-space:nowrap;">'+(b.checkout_date||'—')+'</td>'+
      '<td style="white-space:nowrap;color:var(--gold-lt);">'+(b.total_fee?'NT$'+b.total_fee.toLocaleString():'—')+'</td>'+
      '<td style="white-space:nowrap;">'+(b.income?'NT$'+b.income.toLocaleString():'—')+'</td>'+
      '<td><span class="badge '+bc+'">'+status+'</span></td>'+
      '<td>'+(isEditor?'<button class="action-btn" onclick="openEdit('+b.id+')">編輯</button>':'<span style="font-size:0.78rem;color:var(--text-dim);">僅檢視</span>')+'</td>'+
      '</tr>';
  });
  document.getElementById('bookingTbody').innerHTML=html;
}

// ── 編輯預約 ──
function openEdit(id){
  var b=allBookings.find(function(x){return x.id===id;});
  if(!b)return;
  document.getElementById('editId').value=id;
  document.getElementById('editStatus').value=b.status||'確認中';
  document.getElementById('editIncome').value=b.income||'';
  document.getElementById('editExpense').value=b.expense||'';
  document.getElementById('editExpenseNote').value=b.expense_note||'';
  document.getElementById('editAdminNote').value=b.admin_note||'';
  document.getElementById('editModal').classList.add('open');
}

function saveEdit(){
  var id=parseInt(document.getElementById('editId').value);
  var payload={
    status:document.getElementById('editStatus').value,
    income:parseInt(document.getElementById('editIncome').value)||0,
    expense:parseInt(document.getElementById('editExpense').value)||0,
    expense_note:document.getElementById('editExpenseNote').value.trim(),
    admin_note:document.getElementById('editAdminNote').value.trim()
  };
  fetch(SUPABASE_URL+'/rest/v1/bookings?id=eq.'+id,{
    method:'PATCH',
    headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
    body:JSON.stringify(payload)
  }).then(function(r){
    if(r.ok){
      var idx=allBookings.findIndex(function(x){return x.id===id;});
      if(idx>-1)Object.assign(allBookings[idx],payload);
      closeModal('editModal');updateStats();renderList();
    } else {alert('儲存失敗');}
  }).catch(function(){alert('儲存失敗');});
}

// ── 帳號管理 ──
function loadAccounts(){
  fetch(SUPABASE_URL+'/rest/v1/admin_users?order=created_at.asc&select=id,username,display_name,role,created_at',{
    headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}
  }).then(function(r){return r.json();}).then(function(data){
    if(!data.length){document.getElementById('accountTbody').innerHTML='<tr><td colspan="6" class="empty">尚無帳號</td></tr>';return;}
    var html='';
    data.forEach(function(u,idx){
      var rc=u.role==='editor'?'badge-editor':'badge-viewer';
      var rl=u.role==='editor'?'可編輯':'僅檢視';
      var date=u.created_at?u.created_at.slice(0,10):'—';
      var isSelf=currentUser&&u.id===currentUser.id;
      html+='<tr>'+
        '<td style="color:var(--text-dim);">'+(idx+1)+'</td>'+
        '<td>'+u.username+(isSelf?' <span style="font-size:0.72rem;color:var(--text-dim);">（目前帳號）</span>':'')+'</td>'+
        '<td>'+(u.display_name||'—')+'</td>'+
        '<td><span class="badge '+rc+'">'+rl+'</span></td>'+
        '<td>'+date+'</td>'+
        '<td>'+
          '<button class="action-btn" onclick="openEditAccount('+u.id+')">編輯</button>'+
          (!isSelf?'<button class="action-btn danger" onclick="deleteAccount('+u.id+',\''+u.username+'\')">刪除</button>':'')+
        '</td>'+
        '</tr>';
    });
    document.getElementById('accountTbody').innerHTML=html;
  }).catch(function(){document.getElementById('accountTbody').innerHTML='<tr><td colspan="6" class="empty">載入失敗</td></tr>';});
}

function openAddAccount(){
  document.getElementById('accountModalTitle').textContent='新增帳號';
  document.getElementById('accountEditId').value='';
  document.getElementById('accountUsername').value='';
  document.getElementById('accountDisplayName').value='';
  document.getElementById('accountPassword').value='';
  document.getElementById('accountRole').value='viewer';
  document.getElementById('passHint').textContent='';
  document.getElementById('accountUsername').disabled=false;
  document.getElementById('accountModal').classList.add('open');
}

function openEditAccount(id){
  fetch(SUPABASE_URL+'/rest/v1/admin_users?id=eq.'+id+'&select=id,username,display_name,role',{
    headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}
  }).then(function(r){return r.json();}).then(function(data){
    if(!data.length)return;
    var u=data[0];
    document.getElementById('accountModalTitle').textContent='編輯帳號';
    document.getElementById('accountEditId').value=u.id;
    document.getElementById('accountUsername').value=u.username;
    document.getElementById('accountUsername').disabled=true;
    document.getElementById('accountDisplayName').value=u.display_name||'';
    document.getElementById('accountPassword').value='';
    document.getElementById('accountRole').value=u.role;
    document.getElementById('passHint').textContent='（留空則不修改）';
    document.getElementById('accountModal').classList.add('open');
  });
}

async function saveAccount(){
  var id=document.getElementById('accountEditId').value;
  var username=document.getElementById('accountUsername').value.trim();
  var displayName=document.getElementById('accountDisplayName').value.trim();
  var password=document.getElementById('accountPassword').value;
  var role=document.getElementById('accountRole').value;

  if(!username){alert('請輸入帳號');return;}
  if(!id&&!password){alert('新增帳號請設定密碼');return;}

  var payload={display_name:displayName,role:role};
  if(!id)payload.username=username;
  if(password)payload.password_hash=await hashPassword(password);

  var url=id?SUPABASE_URL+'/rest/v1/admin_users?id=eq.'+id:SUPABASE_URL+'/rest/v1/admin_users';
  var method=id?'PATCH':'POST';

  fetch(url,{
    method:method,
    headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
    body:JSON.stringify(payload)
  }).then(function(r){
    if(r.ok){closeModal('accountModal');loadAccounts();}
    else{alert('儲存失敗，帳號可能已存在');}
  }).catch(function(){alert('儲存失敗');});
}

function deleteAccount(id,username){
  if(!confirm('確定要刪除帳號「'+username+'」嗎？'))return;
  fetch(SUPABASE_URL+'/rest/v1/admin_users?id=eq.'+id,{
    method:'DELETE',
    headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}
  }).then(function(r){
    if(r.ok)loadAccounts();
    else alert('刪除失敗');
  });
}

// ── 月報表 ──
function buildReportMonthSelect(){
  var sel=document.getElementById('reportMonth');
  var now=new Date();
  for(var i=0;i<12;i++){
    var d=new Date(now.getFullYear(),now.getMonth()-i,1);
    var val=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    var opt=document.createElement('option');
    opt.value=val;opt.textContent=d.getFullYear()+'年'+(d.getMonth()+1)+'月';
    if(i===0)opt.selected=true;
    sel.appendChild(opt);
  }
}

function renderReport(){
  var month=document.getElementById('reportMonth').value;
  var data=allBookings.filter(function(b){return b.checkin_date&&b.checkin_date.startsWith(month);});
  var totalFee=data.reduce(function(s,b){return s+(b.total_fee||0);},0);
  var totalInc=data.reduce(function(s,b){return s+(b.income||0);},0);
  var totalExp=data.reduce(function(s,b){return s+(b.expense||0);},0);
  document.getElementById('r1').textContent=data.length;
  document.getElementById('r2').textContent=totalFee.toLocaleString();
  document.getElementById('r3').textContent=totalInc.toLocaleString();
  document.getElementById('r4').textContent=totalExp.toLocaleString();
  document.getElementById('r5').textContent=(totalInc-totalExp).toLocaleString();
  document.getElementById('r6').textContent=(data.length?Math.round(totalFee/data.length):0).toLocaleString();
  var html='';
  if(!data.length){html='<tr><td colspan="9" class="empty">此月份無資料</td></tr>';}
  else{data.forEach(function(b,idx){
    var status=b.status||'確認中';
    var bc=status==='已確認'?'badge-confirmed':status==='已完成'?'badge-done':status==='已取消'?'badge-cancel':'badge-pending';
    var birds=Array.isArray(b.birds)?b.birds.map(function(bi){return bi.name+'×'+bi.count;}).join('、'):'—';
    html+='<tr>'+
      '<td style="color:var(--text-dim);">'+(idx+1)+'</td>'+
      '<td>'+(b.line_name||'—')+'</td>'+
      '<td>'+(b.checkin_date||'—')+'</td>'+
      '<td>'+(b.checkout_date||'—')+'</td>'+
      '<td>'+birds+'</td>'+
      '<td>'+(b.total_fee?'NT$'+b.total_fee.toLocaleString():'—')+'</td>'+
      '<td>'+(b.income?'NT$'+b.income.toLocaleString():'—')+'</td>'+
      '<td>'+(b.expense?'NT$'+b.expense.toLocaleString():'—')+'</td>'+
      '<td><span class="badge '+bc+'">'+status+'</span></td>'+
      '</tr>';
  });}
  document.getElementById('reportTbody').innerHTML=html;
}

function closeModal(id){document.getElementById(id).classList.remove('open');}
document.querySelectorAll('.modal-overlay').forEach(function(m){
  m.addEventListener('click',function(e){if(e.target===this)this.classList.remove('open');});
});
</script>
